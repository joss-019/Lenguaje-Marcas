<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calculadora</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="CalculadoraEstilo.css">

</head>
<body>
<main class="Calculadora">
    
    <table>
        <tr>
            <td colspan="5">
                <input type="text" id="resultado" disabled>
            </td>
        </tr>
        <tr>
            <td><button onclick="1"()>1</button></td>
            <td><button onclick="2"()>2</button></td>
            <td><button onclick="3"()>3</button></td>
    

        </tr>

        <tr>
            <td><button onclick="4"()>4</button></td>
            <td><button onclick="5"()>5</button></td>
            <td><button onclick="6"()>6</button></td>


        </tr>


        <tr>
            <td><button onclick="7"()>7</button></td>
            <td><button onclick="8"()>8</button></td>
            <td><button onclick="9"()>9</button></td>
            <td><button onclick="0"()>0</button></td>
        </tr>

        <tr>

            <td><button onclick="limpiar()">C</button></td>
            <td><button onclick="borrar()">←</button></td>
            <td><button onclick="operar('/')">/</button></td>
            <td><button onclick="operar('*')">*</button></td>
            <td><button onclick="operar('-') "-></button></td>
            <td><button onclick="operar('+') ">+</button></td>
        </tr>
